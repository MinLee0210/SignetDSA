site_name: "SignetDSA"
site_author: "Minh, Le Duc"
site_description: "Enterprise-grade digital signature library in Rust — classical (ECDSA, Ed25519, Ed448, RSA-PSS, Schnorr), threshold (FROST), aggregatable (BLS12-381), and post-quantum (ML-DSA FIPS 204) schemes with a unified factory API and JWS token support."
site_url: "https://minlee0210.github.io/SignetDSA"

repo_url: "https://github.com/MinLee0210/SignetDSA"
repo_name: "MinLee0210/SignetDSA"

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/MinLee0210/SignetDSA
  generator: false
  meta:
    keywords: "rust cryptography, digital signatures, ecdsa, ed25519, ed448, rsa-pss, bip340 schnorr, frost threshold signature, bls signature aggregation, ml-dsa, crystals-dilithium, post-quantum cryptography, fips 204, jws rfc 7515, rustcrypto"
    author: "Minh, Le Duc"
    og:type: "website"
    og:title: "SignetDSA — Unified Digital Signatures in Rust"
    og:description: "A Rust library of digital signature algorithms: classical, threshold, aggregatable, and post-quantum (FIPS 204) schemes with a unified factory API and JWS compact tokens."
    og:url: "https://minlee0210.github.io/SignetDSA"
    twitter:card: "summary_large_image"

theme:
  name: material
  logo: assets/logo.svg
  favicon: assets/favicon.svg
  palette:
    - scheme: default
      primary: deep purple
      accent: amber
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: deep purple
      accent: amber
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.top
    - content.code.copy
    - content.code.annotate
    - search.suggest
    - search.highlight
  icon:
    repo: fontawesome/brands/github

markdown_extensions:
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - admonition
  - pymdownx.details
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true

extra_javascript:
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js

nav:
  - Home: index.md
  - Getting Started:
    - Getting Started: getting_started.md
    - Digital Signatures, Intuition First: learn/intuition.md
    - Choosing an Algorithm: learn/choosing_an_algorithm.md
    - Glossary: learn/glossary.md
  - Algorithms:
    - RSA (PKCS#1 v1.5): algorithms/rsa.md
    - RSA-PSS (RFC 8017): algorithms/rsa_pss.md
    - DSA: algorithms/dsa.md
    - ECDSA (NIST P-256): algorithms/ecdsa.md
    - ECDSA (NIST P-384): algorithms/ecdsa_p384.md
    - ECDSA (secp256k1): algorithms/ecdsa_secp256k1.md
    - EdDSA (Ed25519): algorithms/eddsa.md
    - Ed448: algorithms/ed448.md
    - Schnorr (BIP340): algorithms/schnorr.md
    - FROST (Threshold): algorithms/frost.md
    - BLS (Aggregatable): algorithms/bls.md
    - ML-DSA (Post-Quantum): algorithms/mldsa.md
  - Features:
    - Factory API (Signet): features/factory.md
    - Signed Envelopes & JWS: features/envelope.md
    - Benchmarking: features/benchmarking.md
    - PEM/DER Import-Export: features/pem.md
    - Batch Verification: features/batch_verification.md
    - Public-Key Recovery: features/recovery.md
    - BLS Aggregation: features/aggregation.md
  - CLI: cli.md
  - Python SDK: python.md
  - Security & Interoperability: security.md
  - Design & Architecture: architecture.md
