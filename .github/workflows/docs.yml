name: Deploy Docs

on:
  push:
    branches: ["main"]
    paths:
      - "docs/**"
      - "mkdocs.yml"
      - "requirements-docs.txt"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

# mkdocs gh-deploy pushes the built site straight to the gh-pages branch,
# so the token needs write access to the repo itself.
permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
          cache: "pip"
          cache-dependency-path: requirements-docs.txt

      - name: Install MkDocs Material
        run: pip install -r requirements-docs.txt

      - name: Configure git identity for the gh-pages commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      # Builds with --strict (fails on broken links/nav before anything is
      # pushed) then force-pushes the result to gh-pages via ghp-import.
      # The force-push is expected and harmless here: gh-pages holds only
      # generated output, never hand-written history worth preserving.
      - name: Build and deploy to gh-pages
        run: mkdocs gh-deploy --force --strict
